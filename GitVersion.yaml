calculation:
  branches:
    main:
      increment: None
      is-main-branch: true
      label: ''
      mode: ContinuousDeployment
      regex: ^main$
      source-branches: []
      track-merge-message: true
    feature:
      increment: Minor
      label: alpha
      regex: ^feature/.+
      source-branches:
        - main
      track-merge-message: false
    patch:
      increment: Patch
      label: alpha
      regex: ^patch/.+
      source-branches:
        - main
      track-merge-message: false
    hotfix:
      increment: Patch
      label: alpha
      regex: ^hotfix/.+
      source-branches:
        - main
      track-merge-message: false
    bugfix:
      increment: Patch
      label: alpha
      regex: ^bugfix/.+
      source-branches:
        - main
      track-merge-message: false
    dependabot:
      increment: Patch
      label: alpha
      regex: ^dependabot/.+
      source-branches:
        - main
      track-merge-message: false
    pull-request:
      increment: Inherit
      source-branches:
        - main
        - feature
        - patch
        - hotfix
        - bugfix
        - dependabot
  commit-message-incrementing: Enabled
  ignore:
    sha: []
  major-version-bump-message: "(?i)\\+semver:\\s?breaking"
  minor-version-bump-message: "(?i)merge.*feature/"
  mode: ContinuousDelivery
  no-bump-message: "(?i)\\+semver:\\s?(none|skip)"
  patch-version-bump-message: "(?i)merge.*(patch|hotfix|bugfix|dependabot)/"
  tag-prefix: v
output: {}
