name: Semantic Versioning - GitVersion Calculation 

on:
  workflow_call:
    outputs:
      version:
        description: Full SemVer version (e.g. 1.2.3 on main, 1.3.0-alpha.4 on other branches)
        value: ${{ jobs.versioning.outputs.version }}

jobs:
  versioning:
    name: Determine Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout devops-kit with GitVersion config
        uses: actions/checkout@v7.0.1
        with:
          repository: phx901/devops-kit
          path: .gitversion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        env:
          GITHUB_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
        with:
          configFilePath: .gitversion/GitVersion.yaml

      - name: Version Summary
        run: |
          echo "## Semantic Versioning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version Format | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.gitversion.outputs.semVer }}\` |" >> $GITHUB_STEP_SUMMARY

    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
