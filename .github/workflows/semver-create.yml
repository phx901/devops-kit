name: Semantic Versioning - GitVersion Calculation 

on:
  workflow_call:
    outputs:
      version:
        description: MajorMinorPatch version (e.g. 1.2.3)
        value: ${{ jobs.versioning.outputs.version }}
      semver:
        description: Full SemVer version (e.g. 1.2.3-alpha.4)
        value: ${{ jobs.versioning.outputs.semver }}

jobs:
  versioning:
    name: Determine Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout devops-kit with GitVersion config
        uses: actions/checkout@v7.0.1
        with:
          repository: adanze/devops-kit
          path: .gitversion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: "6.x.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          configFilePath: .gitversion/GitVersion.yaml

      - name: Version Summary
        run: |
          echo "## Semantic Versioning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version Format | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| MajorMinorPatch | \`${{ steps.gitversion.outputs.majorMinorPatch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SemVer | \`${{ steps.gitversion.outputs.semVer }}\` |" >> $GITHUB_STEP_SUMMARY

    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      semver: ${{ steps.gitversion.outputs.semVer }}
