name: Node.js - Build and Test

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Node.js project
        type: string
        required: true
      test-args:
        description: Extra arguments to pass to npm test (e.g. --no-watch, --run)
        type: string
        default: ""
      build-output-path:
        description: Build output folder relative to working-directory
        type: string
        default: "dist"
      install-production-dependencies:
        description: Copy package.json and package-lock.json into the build output and install production dependencies there
        type: boolean
        default: false
      upload-artifact:
        description: Upload the build output as a GitHub Artifact
        type: boolean
        default: false
      artifact-name:
        description: Name for the uploaded artifact (required when upload-artifact is true)
        type: string
        default: ""

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.2"

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Run Tests
        run: npm test -- ${{ inputs.test-args }}
        working-directory: ${{ inputs.working-directory }}

      - name: Build
        run: npm run build
        working-directory: ${{ inputs.working-directory }}

      - name: Install Production Dependencies
        if: inputs.install-production-dependencies
        run: |
          cp package.json package-lock.json "${{ inputs.build-output-path }}/"
          cd "${{ inputs.build-output-path }}"
          npm ci --omit=dev
        working-directory: ${{ inputs.working-directory }}

      - name: Upload Artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.build-output-path }}
