name: .NET - Build and Test

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the .NET solution
        type: string
        required: true
      publish-project:
        description: Path to the .csproj to publish relative to working-directory (required when upload-artifact is true)
        type: string
        default: ""
      runtime:
        description: Runtime identifier for dotnet publish (e.g. linux-arm64)
        type: string
        default: "linux-arm64"
      upload-artifact:
        description: Upload the publish output as a GitHub Artifact
        type: boolean
        default: false
      artifact-name:
        description: Name for the uploaded artifact (required when upload-artifact is true)
        type: string
        default: ""

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Restore Dependencies
        run: dotnet restore
        working-directory: ${{ inputs.working-directory }}

      - name: Run Tests
        run: dotnet test --no-restore --logger trx --results-directory TestResults
        working-directory: ${{ inputs.working-directory }}

      - name: Test Summary
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: .NET Tests
          path: ${{ inputs.working-directory }}/TestResults/*.trx
          reporter: dotnet-trx

      - name: Build
        if: ${{ !inputs.upload-artifact }}
        run: dotnet build --no-restore
        working-directory: ${{ inputs.working-directory }}

      - name: Publish
        if: inputs.upload-artifact
        run: dotnet publish ${{ inputs.publish-project }} -c Release -r ${{ inputs.runtime }} --self-contained false -o publish
        working-directory: ${{ inputs.working-directory }}

      - name: Upload Artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/publish
