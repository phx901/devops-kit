name: .NET - Deploy to AWS Lambda

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the artifact uploaded by the build job
        type: string
        required: true
      lambda-function-name:
        description: Name of the Lambda function to update
        type: string
        required: true
      version:
        description: Application version to set as Lambda environment variable (e.g. 1.2.3)
        type: string
        default: ""
      aws-region:
        description: AWS region
        type: string
        required: true
    secrets:
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: publish

      - name: Create Lambda Package
        run: zip -r lambda-package.zip .
        working-directory: publish

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: ${{ inputs.aws-region }}

      - name: Update Lambda Function Code
        run: aws lambda update-function-code --function-name ${{ inputs.lambda-function-name }} --zip-file fileb://publish/lambda-package.zip

      - name: Set Lambda Version Environment Variable
        if: inputs.version != ''
        run: |
          aws lambda wait function-updated --function-name ${{ inputs.lambda-function-name }}
          CURRENT_VARS=$(aws lambda get-function-configuration \
            --function-name ${{ inputs.lambda-function-name }} \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_VARS=$(echo "$CURRENT_VARS" | jq --arg v "${{ inputs.version }}" '. + {AppVersion: $v}')
          aws lambda update-function-configuration \
            --function-name ${{ inputs.lambda-function-name }} \
            --environment "Variables=$UPDATED_VARS"
